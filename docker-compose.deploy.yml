version: '3.8'

# =============================================================================
# AncientReport Docker Compose - DEPLOY VERSION (pulls from ghcr.io)
# =============================================================================
# Use this file to deploy without needing source files!
# Pull images: docker compose -f docker-compose.deploy.yml pull
# Start:       docker compose -f docker-compose.deploy.yml up -d
# =============================================================================

services:
  nats:
    image: nats:2.10-alpine
    container_name: AncientReport-nats
    command: ["-js", "-sd", "/data"]
    ports:
      - "0.0.0.0:4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    networks:
      - AncientReport
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: AncientReport-clickhouse
    ports:
      - "0.0.0.0:6123:8123"
      - "0.0.0.0:6001:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Asia/Tehran
      CLICKHOUSE_DB: AncientReport
      CLICKHOUSE_USER: AncientReport
      CLICKHOUSE_PASSWORD: AncientReport
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - AncientReport
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 12G
        reservations:
          cpus: '4'
          memory: 6G

  # Python analysis engine (from ghcr.io)
  analysis:
    image: ghcr.io/itsxcr9/ancientreport/analysis:latest
    container_name: AncientReport-analysis
    ports:
      - "6800:8800"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      TZ: Asia/Tehran
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: AncientReport
      CLICKHOUSE_USER: AncientReport
      CLICKHOUSE_PASSWORD: AncientReport
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-google}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash-lite}
      NATS_URL: nats://nats:4222
      UVICORN_WORKERS: "2"
      UVICORN_LIMIT_MAX_REQUESTS: "1000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - clickhouse
      - nats
    networks:
      - AncientReport
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  # React frontend (from ghcr.io)
  ui:
    image: ghcr.io/itsxcr9/ancientreport/ui:latest
    container_name: AncientReport-ui
    ports:
      - "6080:3000"
    environment:
      TZ: Asia/Tehran
      REACT_APP_API_URL: ${API_URL:-http://localhost:6800}
    depends_on:
      - analysis
    networks:
      - AncientReport
    restart: unless-stopped

volumes:
  nats_data:
  clickhouse_data:
  clickhouse_logs:

networks:
  AncientReport:
    driver: bridge
