version: '3.8'

# Central Control Server - Deploy on main monitoring server
# This runs ClickHouse database, Analysis engine, and UI
# Agents on remote servers will connect to this ClickHouse instance

services:
  nats:
    image: nats:2.10-alpine
    container_name: AncientReport-nats
    command: ["-js", "-sd", "/data"]
    ports:
      - "0.0.0.0:4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    networks:
      - AncientReport
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: "udp://65.109.200.75:5515"
        tag: "{{.Name}}"

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: AncientReport-clickhouse
    ports:
      # Expose to 0.0.0.0 to allow remote agents to connect
      - "0.0.0.0:6123:8123"  # HTTP interface for remote agents
      - "0.0.0.0:6001:9000"  # Native protocol (optional)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      TZ: Asia/Tehran
      CLICKHOUSE_DB: AncientReport
      CLICKHOUSE_USER: AncientReport
      CLICKHOUSE_PASSWORD: AncientReport
    networks:
      - AncientReport
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    logging:
      driver: syslog
      options:
        syslog-address: "udp://65.109.200.75:5515"
        tag: "{{.Name}}"

  # Python analysis engine
  analysis:
    # image: ghcr.io/itsxcr9/ancientreport/analysis:latest
    build: 
      context: ./analysis
      dockerfile: Dockerfile
    container_name: AncientReport-analysis
    ports:
      - "6800:8800"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Memory limit to prevent OOM killing other services
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      TZ: Asia/Tehran
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: AncientReport
      CLICKHOUSE_USER: AncientReport
      CLICKHOUSE_PASSWORD: AncientReport
      GEMINI_API_KEY: AIzaSyBPVfd9gaxGvc0FWZzcruZghvWa7MCTcJQ
      AI_PROVIDER: google
      AI_MODEL: gemini-2.5-flash-lite
      # V2 Mode: Enable NATS ingestion gateway (comment out to use V1 legacy mode)
      NATS_URL: nats://nats:4222
      # Worker recycling to prevent memory leaks
      UVICORN_WORKERS: "2"
      UVICORN_LIMIT_MAX_REQUESTS: "1000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./analysis/src:/app/src:ro
    depends_on:
      - clickhouse
      - nats
    networks:
      - AncientReport
    # Healthcheck for auto-restart on failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    logging:
      driver: syslog
      options:
        syslog-address: "udp://65.109.200.75:5515"
        tag: "{{.Name}}"

  # React frontend
  ui:
    # image: ghcr.io/itsxcr9/ancientreport/ui:latest
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: AncientReport-ui
    ports:
      - "6080:3000"
    environment:
      TZ: Asia/Tehran
      REACT_APP_API_URL: http://localhost:6800
    depends_on:
      - analysis
    networks:
      - AncientReport
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: "udp://65.109.200.75:5515"
        tag: "{{.Name}}"

volumes:
  nats_data:
  clickhouse_data:

networks:
  AncientReport:
    driver: bridge
