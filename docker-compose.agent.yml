
services:
  agent:
    image: registry.xcr9.site/images/ancientreport-agent:latest
    container_name: AncientReport-agent
    network_mode: host
    pid: "host" # Required to see host processes, not container processes
    privileged: true # Required for eBPF
    environment:
      TZ: ${TZ:-Asia/Tehran}
      # Log level (warn = only warnings and errors)
      RUST_LOG: AncientReport_agent=warn
      # Central ClickHouse connection - REQUIRED (V1 mode)
      CLICKHOUSE_HOST: ${CENTRAL_SERVER_IP:-localhost}
      CLICKHOUSE_PORT: 6123
      CLICKHOUSE_DB: AncientReport
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-AncientReport}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-AncientReport}
      NATS_URL: nats://${CENTRAL_SERVER_IP:-localhost}:4222
      NATS_ENABLED: true
      AGENT_HOSTNAME: localtest
      PROMETHEUS_ENABLED: true
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/bpf:/sys/fs/bpf:ro
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: always
    logging:
      driver: syslog
      options:
        syslog-address: "udp://${CENTRAL_SERVER_IP:-localhost}:5515"
        tag: "{{.Name}}"
