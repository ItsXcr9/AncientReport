    <script>
      // Suppress errors from browser extensions and third-party scripts
      (function() {
        const originalError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          // Ignore errors from browser extensions or third-party scripts
          if (source && (
            source.includes('standalone.js') ||
            source.includes('extension://') ||
            source.includes('moz-extension://') ||
            source.includes('chrome-extension://') ||
            source.includes('safari-extension://') ||
            source.includes('pageConfig') ||
            source.includes('disabledUntilTimestamp')
          )) {
            return true; // Suppress the error
          }
          // Call original error handler if it exists
          if (originalError) {
            return originalError(message, source, lineno, colno, error);
          }
          return false;
        };

        // Also catch unhandled promise rejections from extensions
        const originalUnhandledRejection = window.onunhandledrejection;
        window.onunhandledrejection = function(event) {
          if (event.reason && typeof event.reason === 'object' && event.reason.stack) {
            const stack = event.reason.stack.toString();
            if (stack.includes('standalone.js') || 
                stack.includes('extension://') ||
                stack.includes('moz-extension://') ||
                stack.includes('chrome-extension://') ||
                stack.includes('pageConfig') ||
                stack.includes('disabledUntilTimestamp')) {
              event.preventDefault();
              return;
            }
          }
          if (originalUnhandledRejection) {
            originalUnhandledRejection(event);
          }
        };

        // Suppress console errors from extensions
        const originalConsoleError = console.error;
        console.error = function(...args) {
          const message = args.join(' ');
          if (message.includes('standalone.js') ||
              message.includes('pageConfig') ||
              message.includes('disabledUntilTimestamp') ||
              message.includes('extension://')) {
            return; // Suppress
          }
          originalConsoleError.apply(console, args);
        };
      })();
    </script>
