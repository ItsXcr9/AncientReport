# NATS JetStream Configuration for AncientReport

# Server name
server_name: AncientReport-NATS

# Enable JetStream
jetstream {
    # Store directory
    store_dir: /data
    
    # Memory/file limits
    max_memory_store: 1GB
    max_file_store: 10GB
}

# Logging
debug: false
trace: false
logtime: true

# Connection limits
max_connections: 100000
max_subscriptions: 1000

# Network
port: 4222
http_port: 8222

# Monitoring
http: 8222

# Streams configuration (created at runtime via API, documented here)
# Stream: METRICS
#   - Subjects: metrics.system.*, metrics.network.*, metrics.disk.*
#   - Retention: Limits (max 1GB or 24h)
#   - Storage: File
#   - Replicas: 1
# 
# Stream: EVENTS  
#   - Subjects: events.*
#   - Retention: Limits (max 100MB or 7d)
#   - Storage: File
#   - Replicas: 1
