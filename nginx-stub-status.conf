# NGINX Stub Status Configuration
# Add this to your NGINX configuration to enable metrics endpoint
#
# For NGINX running in Docker:
#   - Copy this file to your nginx config directory
#   - Include it in your main nginx.conf or default site config
#
# For NGINX running on host:
#   - Add this location block to your existing server configuration
#   - Usually in /etc/nginx/sites-available/default or /etc/nginx/nginx.conf

# Option 1: Separate server block (localhost only - recommended)
server {
    listen 80;
    server_name localhost 127.0.0.1;
    
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Docker networks
        deny all;
    }
}

# Option 2: Add to existing server block
# Uncomment and add this location block to your existing server {} section:
