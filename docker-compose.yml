services:
  nats:
    image: nats:2.10-alpine
    container_name: AncientReport-nats
    command:
      - "-js"
      - "-sd"
      - "/data"
    ports:
      - "0.0.0.0:4222:4222" # Expose to host network for agent
      - "8222:8222"
    volumes:
      - nats-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - AncientReport
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: "udp://65.109.200.75:5515"
        tag: "{{.Name}}"

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: AncientReport-clickhouse
    ports:
      - "6123:8123"
      - "6001:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Asia/Tehran
      CLICKHOUSE_DB: AncientReport
      CLICKHOUSE_USER: AncientReport
      CLICKHOUSE_PASSWORD: AncientReport
    networks:
      - AncientReport
    logging:
      driver: syslog
      options:
        syslog-address: "udp://65.109.200.75:5515"
        tag: "{{.Name}}"

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: AncientReport-agent
    network_mode: host
    pid: "host" # Required to see host processes, not container processes
    privileged: true # Required for eBPF
    environment:
      TZ: Asia/Tehran
      # V2 Mode: Enable NATS streaming (comment out to use V1 legacy mode)
      NATS_URL: nats://localhost:4222
      # ClickHouse configuration
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: 6123
      CLICKHOUSE_DB: AncientReport
      CLICKHOUSE_USER: AncientReport
      CLICKHOUSE_PASSWORD: AncientReport
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /proc:/host/proc:ro
      # Mount config directory instead of file to avoid Docker creating a directory
      - ./agent:/etc/AncientReport/config-source:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount timezone files to ensure correct time
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - clickhouse
      - nats
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: "udp://65.109.200.75:5515"
        tag: "{{.Name}}"

  # Python analysis engine
  analysis:
    build:
      context: ./analysis
      dockerfile: Dockerfile
    container_name: AncientReport-analysis
    ports:
      - "6800:8800"
    environment:
      TZ: Asia/Tehran
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: AncientReport
      CLICKHOUSE_USER: AncientReport
      CLICKHOUSE_PASSWORD: AncientReport
      GEMINI_API_KEY: AIzaSyBPVfd9gaxGvc0FWZzcruZghvWa7MCTcJQ
      AI_PROVIDER: google
      AI_MODEL: gemini-2.5-flash-lite
      # V2 Mode: Enable NATS ingestion gateway (comment out to use V1 legacy mode)
      NATS_URL: nats://nats:4222
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - clickhouse
      - nats
    networks:
      - AncientReport
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: "udp://65.109.200.75:5515"
        tag: "{{.Name}}"

  # React frontend (optional)
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: AncientReport-ui
    ports:
      - "6080:3000"
    environment:
      TZ: Asia/Tehran
      REACT_APP_API_URL: http://localhost:8000
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - analysis
    networks:
      - AncientReport
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: "udp://65.109.200.75:5515"
        tag: "{{.Name}}"

volumes:
  nats-data:
  clickhouse_data:

networks:
  AncientReport:
    driver: bridge
